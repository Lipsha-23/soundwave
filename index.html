<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soundwave – music player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><i>♪</i>Soundwave</div>
    <div class="nav" id="nav"></div>
    <div class="sub">Playlists</div>
    <div class="nav" id="pl"></div>
  </aside>
  <main class="main" id="main"><canvas id="viz" aria-hidden="true"></canvas>
    <div class="hero" id="hero"></div>
    <div class="bar">
      <button class="big" id="bigplay" aria-label="Play">▶</button>
      <input class="search" id="q" type="search" placeholder="Search songs or artists" aria-label="Search">
    </div>
    <div class="hint">Every track is synthesized live in your browser, so there are no audio files to load.</div>
    <div class="list" id="list"></div>
  </main>
</div>
<footer class="player">
  <div class="now" id="now"></div>
  <div class="ctl">
    <div class="btns">
      <button id="shuf" aria-label="Shuffle">⇄</button>
      <button id="prev" aria-label="Previous">⏮</button>
      <button class="pp" id="pp" aria-label="Play">▶</button>
      <button id="next" aria-label="Next">⏭</button>
      <button id="rep" aria-label="Repeat">⟳</button>
    </div>
    <div class="seek"><span id="cur">0:00</span><input type="range" id="sk" min="0" max="1000" value="0" aria-label="Seek"><span id="tot">0:00</span></div>
  </div>
  <div class="vol"><span>🔊</span><input type="range" id="vl" min="0" max="100" value="70" aria-label="Volume"></div>
</footer>
<div id="menu" hidden></div><div id="toast" hidden role="status"></div>
<script src="script.js"></script>
</body>
</html>
